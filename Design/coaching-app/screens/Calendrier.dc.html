<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Calendrier</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="ds/coach/components/bundle.css">
<script src="ds/coach/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Condensed:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:var(--lime-ink)}a:hover{color:var(--ink)}
.day{appearance:none;border:0;cursor:pointer;background:transparent;color:var(--ink);min-height:var(--control-lg);border-radius:var(--radius-sm);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:var(--space-1);padding:var(--space-1) 0;font-family:var(--font-sans)}
.day:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mark{width:28px;height:22px;border-radius:var(--radius-xs);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:13px}
</style>
</helmet>
<div class="screen" data-theme="light" style="width: 390px; height: 1000px;">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 24px 8px 8px 16px;">
    <h1 class="t-display-lg" style="margin: 0;">Octobre</h1>
    <div style="display: flex;">
      <button class="icon-btn" type="button" aria-label="Mois précédent"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
      <button class="icon-btn" type="button" aria-label="Mois suivant"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button>
    </div>
  </header>
  <p class="t-caption" style="margin: 0; padding: 0 16px 12px; color: var(--ink-muted);">Force 2026 · A le lundi, B le mercredi, C le samedi</p>

  <main style="flex-grow: 1; display: flex; flex-direction: column; gap: 20px; padding: 0 16px 16px;">
    <div class="card" style="padding: 8px;">
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; padding-bottom: 4px;">
        <sc-for list="{{dows}}" as="d" hint-placeholder-count="7">
          <span class="t-label" style="text-align: center; color: var(--ink-muted); padding: 4px 0;">{{d}}</span>
        </sc-for>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px;">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
          <button class="day" type="button" aria-label="{{c.aria}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="{{c.dayStyle}}">
            <span class="num" style="font-size: 15px; font-weight: 600; line-height: 18px;">{{c.n}}</span>
            <span class="mark" style="{{c.markStyle}}">{{c.mark}}</span>
          </button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 8px;">
      <x-import component-from-global-scope="Coach.SessionStatus" status="validated"></x-import>
      <x-import component-from-global-scope="Coach.SessionStatus" status="today"></x-import>
      <x-import component-from-global-scope="Coach.SessionStatus" status="planned"></x-import>
      <x-import component-from-global-scope="Coach.SessionStatus" status="missed"></x-import>
      <x-import component-from-global-scope="Coach.SessionStatus" status="unplanned"></x-import>
    </div>

    <section class="card" aria-labelledby="sel" style="padding: 16px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px;">
        <span class="t-label" style="color: var(--ink-muted);">{{sel.date}}</span>
        <x-import component-from-global-scope="Coach.SessionStatus" status="{{sel.status}}"></x-import>
      </div>
      <h2 id="sel" class="t-title-lg" style="margin: 0;">{{sel.title}}</h2>
      <p class="t-body" style="margin: 0; color: var(--ink-muted);">{{sel.detail}}</p>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
        <x-import component-from-global-scope="Coach.Button" variant="secondary" block="{{yes}}">Déplacer</x-import>
        <a class="ca-btn ca-btn-secondary ca-btn-block" href="Probleme.dc.html">Problème</a>
      </div>
      <x-import component-from-global-scope="Coach.Button" variant="ghost" block="{{yes}}">Marquer comme manquée</x-import>
    </section>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
      <button class="chip" type="button" style="justify-content: center;"><svg class="icon icon-20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Hors programme</button>
      <button class="chip" type="button" style="justify-content: center;">Repos ou blessure</button>
    </div>
  </main>

  <nav class="nav" aria-label="Navigation principale">
    <a href="Main.dc.html"><span class="pill"><svg class="icon icon-20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5h11M6.5 17.5h11M3 9v6M21 9v6M6.5 5v14M17.5 5v14"></path></svg></span>Séance</a>
    <a href="Calendrier.dc.html" aria-current="page"><span class="pill"><svg class="icon icon-20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg></span>Calendrier</a>
    <a href="Programme.dc.html"><span class="pill"><svg class="icon icon-20" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg></span>Programme</a>
    <a href="Progres.dc.html"><span class="pill"><svg class="icon icon-20" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 7l-8.5 8.5-5-5L2 17"></path><path d="M16 7h6v6"></path></svg></span>Progrès</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { picked: 17 }; }
  renderVals() {
    var dayNames = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
    var names = { 'A': 'Séance A', 'B': 'Séance B', 'C': 'Séance C', '+': 'Séance hors programme' };
    var info = {};
    function put(d, mark, status) { info[d] = { mark: mark, status: status }; }
    put(5, 'A', 'validated'); put(7, 'B', 'missed'); put(10, 'C', 'validated'); put(11, '+', 'unplanned');
    put(12, 'A', 'validated'); put(14, 'B', 'validated'); put(17, 'C', 'today');
    [[19, 'A'], [21, 'B'], [24, 'C'], [26, 'A'], [28, 'B'], [31, 'C']].forEach(function (p) { put(p[0], p[1], 'planned'); });
    var styles = {
      validated: 'background: var(--lime-soft); color: var(--lime-ink);',
      today: 'background: var(--lime); color: var(--on-lime);',
      planned: 'box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--ink-muted);',
      missed: 'background: var(--danger); color: var(--on-danger);',
      unplanned: 'background: var(--surface-sunken); color: var(--ink);'
    };
    var labels = { validated: 'validée', today: "aujourd'hui", planned: 'prévue', missed: 'manquée', unplanned: 'hors programme' };
    var cells = [];
    var offset = 3;
    for (var i = 0; i < 35; i++) {
      var n = i - offset + 1;
      if (n < 1 || n > 31) { cells.push({ n: '', mark: '', aria: 'Vide', markStyle: 'visibility: hidden;', dayStyle: 'visibility: hidden;', on: 'false', pick: null }); continue; }
      var it = info[n];
      var on = this.state.picked === n;
      var day = n;
      cells.push({
        n: n,
        mark: it ? (it.status === 'missed' ? '× ' + it.mark : it.status === 'validated' ? '✓ ' + it.mark : it.mark) : '',
        aria: n + ' octobre' + (it ? ', ' + names[it.mark] + ' ' + labels[it.status] : ''),
        markStyle: it ? styles[it.status] : 'visibility: hidden;',
        dayStyle: on ? 'box-shadow: inset 0 0 0 2px var(--ink);' : '',
        on: on ? 'true' : 'false',
        pick: it ? () => this.setState({ picked: day }) : null
      });
    }
    var p = this.state.picked;
    var pi = info[p];
    var dow = dayNames[(p + offset - 1) % 7];
    var sel = pi ? {
      date: dow + ' ' + p + ' octobre',
      status: pi.status,
      title: names[pi.mark],
      detail: pi.status === 'missed' ? 'Séance manquée : le programme ne se décale pas.' : pi.status === 'validated' ? 'Validée. La modifier replanifie la séance suivante.' : pi.status === 'unplanned' ? 'Pour info seulement : ni hausse ni échec.' : (pi.mark === 'C' ? 'Squat, tractions lestées, développé couché, rowing haltère.' : 'Plan prêt. Signale un problème pour le replanifier.')
    } : { date: dow + ' ' + p + ' octobre', status: 'planned', title: 'Jour de repos', detail: 'Aucune séance prévue ce jour.' };
    return { yes: true, dows: ['L', 'M', 'M', 'J', 'V', 'S', 'D'], cells: cells, sel: sel };
  }
}
</script>
</body>
</html>
