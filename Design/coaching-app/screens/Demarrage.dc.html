<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Démarrer un programme</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="ds/coach/components/bundle.css">
<script src="ds/coach/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Condensed:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:var(--lime-ink)}a:hover{color:var(--ink)}
.opt{appearance:none;border:0;cursor:pointer;text-align:left;width:100%;display:flex;gap:var(--space-3);align-items:flex-start;padding:var(--space-4);border-radius:var(--radius-lg);background:var(--surface-raised);box-shadow:inset 0 0 0 1px var(--line-strong);color:var(--ink);font-family:var(--font-sans)}
.opt:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.opt-on{box-shadow:inset 0 0 0 2px var(--ink)}
.radio{flex:none;width:22px;height:22px;border-radius:var(--radius-pill);box-shadow:inset 0 0 0 2px var(--line-strong);margin-top:1px}
.opt-on .radio{box-shadow:inset 0 0 0 7px var(--ink)}
</style>
</helmet>
<div class="screen" data-theme="light" style="width: 390px; height: 1080px;">
  <header style="display: flex; align-items: center; padding: 8px 16px 0 8px; gap: 4px;">
    <a class="icon-btn" href="Programme.dc.html" aria-label="Retour"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <span class="t-label" style="color: var(--ink-muted);">Nouveau programme · étape 3 sur 3</span>
  </header>

  <main style="flex-grow: 1; display: flex; flex-direction: column; gap: 24px; padding: 16px;">
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <h1 class="t-display-lg" style="margin: 0;">Charges de départ</h1>
      <p class="t-body" style="margin: 0; color: var(--ink-muted);">« Hiver 2027 » a 3 exercices sans historique. Comment fixer leurs premières charges ?</p>
    </div>

    <div role="radiogroup" aria-label="Méthode" style="display: flex; flex-direction: column; gap: 8px;">
      <sc-for list="{{options}}" as="o" hint-placeholder-count="3">
        <button type="button" role="radio" aria-checked="{{o.checked}}" class="{{o.cls}}" onClick="{{o.pick}}">
          <span class="radio" aria-hidden="true"></span>
          <span style="display: flex; flex-direction: column; gap: 2px;">
            <span class="t-body-strong">{{o.title}}</span>
            <span class="t-caption" style="color: var(--ink-muted);">{{o.text}}</span>
          </span>
        </button>
      </sc-for>
    </div>

    <section aria-labelledby="est" style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <h2 id="est" class="t-label" style="margin: 0; color: var(--ink-muted);">Estimations de Gemini</h2>
        <span class="t-caption" style="color: var(--ink-muted);">À approuver ou modifier</span>
      </div>
      <sc-for list="{{estimates}}" as="e" hint-placeholder-count="3">
        <div class="card" style="padding: 12px 12px 12px 16px; display: flex; flex-direction: column; gap: 8px;">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
            <span class="t-body-strong">{{e.name}}</span>
            <x-import component-from-global-scope="Coach.GoalBadge" goal="{{e.goal}}" size="sm"></x-import>
          </div>
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
            <span class="t-title-md">{{e.load}}</span>
            <button type="button" class="chip" style="min-height: 48px;">Modifier</button>
          </div>
          <span class="t-caption" style="color: var(--ink-muted);">{{e.why}}</span>
        </div>
      </sc-for>
    </section>
  </main>

  <div style="padding: 16px;">
    <a class="ca-btn ca-btn-primary ca-btn-lg ca-btn-block" href="Programme.dc.html">Approuver et démarrer</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1080}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { pick: 'est' }; }
  renderVals() {
    var p = this.state.pick;
    var opts = [
      { id: 'init', title: 'Poids initiaux', text: 'Tu connais tes charges : tu les saisis toi-même.' },
      { id: 'test', title: 'Séance test', text: 'Gemini planifie une séance pour mesurer ton niveau sur ces exercices.' },
      { id: 'est', title: 'Estimations de départ', text: 'Gemini propose des charges depuis tes mouvements proches et la place de l’exercice dans la séance.' }
    ];
    return {
      options: opts.map((o) => ({ title: o.title, text: o.text, checked: p === o.id ? 'true' : 'false', cls: p === o.id ? 'opt opt-on' : 'opt', pick: () => this.setState({ pick: o.id }) })),
      estimates: [
        { name: 'Front squat', goal: 'strength', load: '78 kg × 3', why: 'D’après ton squat (1RM estimé 117,9 kg), en 1re position.' },
        { name: 'Presse à cuisses', goal: 'hypertrophy', load: '140 kg × 8', why: 'D’après ton squat, en 2e position après le front squat. Machine guidée, pas de 2 kg.' },
        { name: 'Curl haltères', goal: 'endurance', load: '10 kg × 12', why: 'D’après le rowing haltère, en dernière position : fatigue prise en compte.' }
      ]
    };
  }
}
</script>
</body>
</html>
