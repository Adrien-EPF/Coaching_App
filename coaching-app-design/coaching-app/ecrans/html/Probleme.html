<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Signaler un problème</title>
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/ds/coach/components/bundle.css">
<style>

    .sc-placeholder{background:color-mix(in srgb,currentColor 8%,transparent);
      border:1px solid color-mix(in srgb,currentColor 50%,transparent);
      border-radius:2px;box-sizing:border-box;overflow:hidden}
    @keyframes sc-shine{0%{background-position:100% 50%}100%{background-position:0% 50%}}
    html.sc-dc-streaming .sc-placeholder,
    html.sc-dc-streaming .sc-interp.sc-missing{position:relative;
      background:color-mix(in srgb,currentColor 5%,transparent);
      border-color:transparent}
    html.sc-dc-streaming .sc-placeholder::before,
    html.sc-dc-streaming .sc-interp.sc-missing::before{content:'';
      position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(90deg,rgba(217,119,87,0) 25%,rgba(247,225,211,.95) 37%,rgba(217,119,87,0) 63%);
      background-size:400% 100%;animation:sc-shine 1.4s ease infinite}
    html.sc-dc-streaming .sc-placeholder:nth-child(n+9 of .sc-placeholder)::before,
    html.sc-dc-streaming .sc-interp.sc-missing:nth-child(n+9 of .sc-interp.sc-missing)::before{animation:none;
      background:color-mix(in srgb,currentColor 8%,transparent)}
    .sc-placeholder-error{padding:4px 8px;font:11px/1.4 ui-monospace,monospace;
      color:color-mix(in srgb,currentColor 70%,transparent);word-break:break-word}
    .sc-interp.sc-missing{display:inline-block;width:2em;height:1em;overflow:hidden;
      vertical-align:text-bottom;background:rgba(255,255,255,.3);border:1px solid rgba(0,0,0,.5);
      border-radius:2px;box-sizing:border-box;color:transparent;
      user-select:none}
    .sc-interp.sc-unresolved{font-family:ui-monospace,monospace;font-size:.85em;
      color:color-mix(in srgb,currentColor 50%,transparent);
      background:color-mix(in srgb,currentColor 10%,transparent);border-radius:3px;
      padding:0 3px}
    .sc-host.sc-has-error{position:relative}
    .sc-logic-error{position:absolute;top:8px;left:8px;z-index:2147483647;max-width:60ch;
      padding:6px 10px;background:#b00020;color:#fff;font:12px/1.4 ui-monospace,monospace;
      border-radius:4px;white-space:pre-wrap;pointer-events:none}
    /* Mirrors PRINT_BASELINE_CSS in apps/web deck-stage-export.ts — keep both
       in sync until dc-runtime regains a build step. */
    @media print {
      @page { margin: 0.5cm; }
      figure, table { break-inside: avoid; }
      #dc-root, #dc-root > .sc-host { height: auto; }
      *, *::before, *::after {
        print-color-adjust: exact; -webkit-print-color-adjust: exact;
        backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
        animation-delay: -99s !important; animation-duration: .001s !important;
        animation-iteration-count: 1 !important; animation-fill-mode: both !important;
        animation-play-state: running !important; transition-duration: 0s !important;
      }
    }
  
x-dc{display:none!important}

body{margin:0}
a{color:var(--lime-ink)}a:hover{color:var(--ink)}

body{margin:0;background:#d9dcd1;display:flex;justify-content:center;padding:24px 0}
.screen{box-shadow:0 8px 32px rgba(17,20,16,.18);border-radius:12px}
</style>
</head>
<body>
<div data-dc-tpl="2" class="screen" data-theme="light" style="width: 390px; height: 844px; position: relative;">
  <div data-dc-tpl="3" aria-hidden="true" style="padding: 24px 16px; display: flex; flex-direction: column; gap: 16px;">
    <span data-dc-tpl="4" class="t-display-lg">Octobre</span>
    <div data-dc-tpl="5" class="card" style="height: 300px;"></div>
  </div>
  <div data-dc-tpl="6" class="scrim" style="position: absolute; inset: 0px;"></div>

  <section data-dc-tpl="7" class="sheet" role="dialog" aria-modal="true" aria-labelledby="pb-title" style="position: absolute; left: 0px; right: 0px; bottom: 0px; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 20px;">
    <div data-dc-tpl="8" class="grabber"></div>
    <div data-dc-tpl="9" style="display: flex; flex-direction: column; gap: 4px;">
      <span data-dc-tpl="10" class="t-label" style="color: var(--ink-muted);">Séance A · lundi 19 octobre</span>
      <h2 data-dc-tpl="11" id="pb-title" class="t-title-lg" style="margin: 0px;">Signaler un problème</h2>
      <p data-dc-tpl="12" class="t-body" style="margin: 0px; color: var(--ink-muted);">Le plan de cette séance sera recalculé avec ta note.</p>
    </div>

    <fieldset data-dc-tpl="13" style="border: 0px; margin: 0px; padding: 0px; display: flex; flex-direction: column; gap: 8px;">
      <legend data-dc-tpl="14" class="t-label" style="color: var(--ink-muted); padding: 0px 0px 8px;">Ce qui ne va pas</legend>
      <div data-dc-tpl="15" style="display: flex; flex-wrap: wrap; gap: 8px;">
        
          <button data-dc-tpl="17" type="button" class="chip chip-on" aria-pressed="true"><span class="sc-interp">Mauvais sommeil</span></button>
        
          <button data-dc-tpl="17" type="button" class="chip chip-on" aria-pressed="true"><span class="sc-interp">Douleur</span></button>
        
          <button data-dc-tpl="17" type="button" class="chip" aria-pressed="false"><span class="sc-interp">Fatigue</span></button>
        
          <button data-dc-tpl="17" type="button" class="chip" aria-pressed="false"><span class="sc-interp">Malade</span></button>
        
          <button data-dc-tpl="17" type="button" class="chip" aria-pressed="false"><span class="sc-interp">Stress</span></button>
        
          <button data-dc-tpl="17" type="button" class="chip" aria-pressed="false"><span class="sc-interp">Autre</span></button>
        
      </div>
    </fieldset>

    <div data-dc-tpl="18" style="display: flex; flex-direction: column; gap: 8px;">
      <label data-dc-tpl="19" for="pb-note" class="t-label" style="color: var(--ink-muted);">Précisions</label>
      <textarea data-dc-tpl="20" id="pb-note" class="field" rows="3" style="resize: none;">5 h de sommeil. Épaule droite un peu raide.</textarea>
    </div>

    <div data-dc-tpl="21" style="display: flex; gap: 8px; align-items: flex-start; padding: 12px; border-radius: var(--radius-md); background: var(--surface-sunken);">
      <svg data-dc-tpl="22" class="icon icon-20" viewBox="0 0 24 24" aria-hidden="true" style="margin-top: 1px;"><path data-dc-tpl="23" d="M12 2l8 3v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V5z"></path></svg>
      <p data-dc-tpl="24" class="t-caption" style="margin: 0px; color: var(--ink);">Avec un problème signalé, Gemini peut garder ou baisser les charges, jamais les monter.</p>
    </div>

    <div data-dc-tpl="25" style="display: flex; flex-direction: column; gap: 8px;">
      <a data-dc-tpl="26" class="ca-btn ca-btn-primary ca-btn-lg ca-btn-block" href="Calendrier.html">Replanifier la séance</a>
      <a data-dc-tpl="27" class="ca-btn ca-btn-ghost ca-btn-block" href="Calendrier.html">Annuler</a>
    </div>
  </section></div>
</body>
</html>
