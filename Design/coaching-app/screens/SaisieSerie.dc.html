<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Saisir une série</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="ds/coach/components/bundle.css">
<script src="ds/coach/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Condensed:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:var(--lime-ink)}a:hover{color:var(--ink)}
</style>
</helmet>
<div class="screen" data-theme="light" style="width: 390px; height: 844px; position: relative;">
  <div aria-hidden="true" style="background: var(--contrast); color: var(--on-contrast); padding: 24px 24px 20px; border-radius: 0 0 var(--radius-lg) var(--radius-lg);">
    <span class="t-display-lg">Séance C</span>
  </div>
  <div aria-hidden="true" style="padding: 20px 16px;">
    <div class="card" style="height: 220px;"></div>
  </div>

  <div class="scrim" style="position: absolute; inset: 0;"></div>

  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 20px;">
    <div class="grabber"></div>
    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <span class="t-label" style="color: var(--ink-muted);">Série 3 sur 5</span>
        <h2 id="sheet-title" class="t-title-lg" style="margin: 0;">Tractions lestées</h2>
        <span class="t-caption num" style="color: var(--ink-muted);">Dernière fois : +12 kg × 5 · RPE 9</span>
      </div>
      <a class="icon-btn" href="Seance.dc.html" aria-label="Fermer"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; justify-content: space-between;">
        <span class="t-label" style="color: var(--ink-muted);">Charge ajoutée</span>
        <span class="t-caption" style="color: var(--ink-muted);">Ceinture · pas de 1 kg</span>
      </div>
      <div class="stepper">
        <button class="step-btn" type="button" aria-label="Retirer 1 kg" onClick="{{lessW}}"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
        <div class="step-val" aria-live="polite">{{weightText}}</div>
        <button class="step-btn" type="button" aria-label="Ajouter 1 kg" onClick="{{moreW}}"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; justify-content: space-between;">
        <span class="t-label" style="color: var(--ink-muted);">Reps</span>
        <span class="t-caption" style="color: var(--ink-muted);">Prévu : 5 · fourchette 3-5</span>
      </div>
      <div class="stepper">
        <button class="step-btn" type="button" aria-label="Une rep de moins" onClick="{{lessR}}"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
        <div class="step-val" aria-live="polite">{{reps}}</div>
        <button class="step-btn" type="button" aria-label="Une rep de plus" onClick="{{moreR}}"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
      </div>
    </div>

    <x-import component-from-global-scope="Coach.RpePicker" max="{{ 9 }}" default-value="{{ 8.5 }}"></x-import>

    <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 8px;">
      <x-import component-from-global-scope="Coach.Button" variant="secondary" size="lg" block="{{yes}}">Non effectuée</x-import>
      <a class="ca-btn ca-btn-primary ca-btn-lg ca-btn-block" href="Seance.dc.html">Enregistrer</a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { w: 12, r: 5 }; }
  renderVals() {
    var s = this.state;
    return {
      yes: true,
      weightText: '+' + String(s.w).replace('.', ',') + ' kg',
      reps: s.r,
      lessW: () => this.setState({ w: Math.max(0, s.w - 1) }),
      moreW: () => this.setState({ w: Math.min(100, s.w + 1) }),
      lessR: () => this.setState({ r: Math.max(0, s.r - 1) }),
      moreR: () => this.setState({ r: s.r + 1 })
    };
  }
}
</script>
</body>
</html>
