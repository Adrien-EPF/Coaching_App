<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Saisir une série</title>
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/ds/coach/components/bundle.css">
<style>

    .sc-placeholder{background:color-mix(in srgb,currentColor 8%,transparent);
      border:1px solid color-mix(in srgb,currentColor 50%,transparent);
      border-radius:2px;box-sizing:border-box;overflow:hidden}
    @keyframes sc-shine{0%{background-position:100% 50%}100%{background-position:0% 50%}}
    html.sc-dc-streaming .sc-placeholder,
    html.sc-dc-streaming .sc-interp.sc-missing{position:relative;
      background:color-mix(in srgb,currentColor 5%,transparent);
      border-color:transparent}
    html.sc-dc-streaming .sc-placeholder::before,
    html.sc-dc-streaming .sc-interp.sc-missing::before{content:'';
      position:absolute;inset:0;pointer-events:none;
      background:linear-gradient(90deg,rgba(217,119,87,0) 25%,rgba(247,225,211,.95) 37%,rgba(217,119,87,0) 63%);
      background-size:400% 100%;animation:sc-shine 1.4s ease infinite}
    html.sc-dc-streaming .sc-placeholder:nth-child(n+9 of .sc-placeholder)::before,
    html.sc-dc-streaming .sc-interp.sc-missing:nth-child(n+9 of .sc-interp.sc-missing)::before{animation:none;
      background:color-mix(in srgb,currentColor 8%,transparent)}
    .sc-placeholder-error{padding:4px 8px;font:11px/1.4 ui-monospace,monospace;
      color:color-mix(in srgb,currentColor 70%,transparent);word-break:break-word}
    .sc-interp.sc-missing{display:inline-block;width:2em;height:1em;overflow:hidden;
      vertical-align:text-bottom;background:rgba(255,255,255,.3);border:1px solid rgba(0,0,0,.5);
      border-radius:2px;box-sizing:border-box;color:transparent;
      user-select:none}
    .sc-interp.sc-unresolved{font-family:ui-monospace,monospace;font-size:.85em;
      color:color-mix(in srgb,currentColor 50%,transparent);
      background:color-mix(in srgb,currentColor 10%,transparent);border-radius:3px;
      padding:0 3px}
    .sc-host.sc-has-error{position:relative}
    .sc-logic-error{position:absolute;top:8px;left:8px;z-index:2147483647;max-width:60ch;
      padding:6px 10px;background:#b00020;color:#fff;font:12px/1.4 ui-monospace,monospace;
      border-radius:4px;white-space:pre-wrap;pointer-events:none}
    /* Mirrors PRINT_BASELINE_CSS in apps/web deck-stage-export.ts — keep both
       in sync until dc-runtime regains a build step. */
    @media print {
      @page { margin: 0.5cm; }
      figure, table { break-inside: avoid; }
      #dc-root, #dc-root > .sc-host { height: auto; }
      *, *::before, *::after {
        print-color-adjust: exact; -webkit-print-color-adjust: exact;
        backdrop-filter: none !important; -webkit-backdrop-filter: none !important;
        animation-delay: -99s !important; animation-duration: .001s !important;
        animation-iteration-count: 1 !important; animation-fill-mode: both !important;
        animation-play-state: running !important; transition-duration: 0s !important;
      }
    }
  
x-dc{display:none!important}

body{margin:0}
a{color:var(--lime-ink)}a:hover{color:var(--ink)}

body{margin:0;background:#d9dcd1;display:flex;justify-content:center;padding:24px 0}
.screen{box-shadow:0 8px 32px rgba(17,20,16,.18);border-radius:12px}
</style>
</head>
<body>
<div data-dc-tpl="2" class="screen" data-theme="light" style="width: 390px; height: 844px; position: relative;">
  <div data-dc-tpl="3" aria-hidden="true" style="background: var(--contrast); color: var(--on-contrast); padding: 24px 24px 20px; border-radius: 0 0 var(--radius-lg) var(--radius-lg);">
    <span data-dc-tpl="4" class="t-display-lg">Séance C</span>
  </div>
  <div data-dc-tpl="5" aria-hidden="true" style="padding: 20px 16px;">
    <div data-dc-tpl="6" class="card" style="height: 220px;"></div>
  </div>

  <div data-dc-tpl="7" class="scrim" style="position: absolute; inset: 0px;"></div>

  <section data-dc-tpl="8" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="position: absolute; left: 0px; right: 0px; bottom: 0px; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 20px;">
    <div data-dc-tpl="9" class="grabber"></div>
    <div data-dc-tpl="10" style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;">
      <div data-dc-tpl="11" style="display: flex; flex-direction: column; gap: 4px;">
        <span data-dc-tpl="12" class="t-label" style="color: var(--ink-muted);">Série 3 sur 5</span>
        <h2 data-dc-tpl="13" id="sheet-title" class="t-title-lg" style="margin: 0px;">Tractions lestées</h2>
        <span data-dc-tpl="14" class="t-caption num" style="color: var(--ink-muted);">Dernière fois : +12 kg × 5 · RPE 9</span>
      </div>
      <a data-dc-tpl="15" class="icon-btn" href="Seance.html" aria-label="Fermer"><svg data-dc-tpl="16" class="icon" viewBox="0 0 24 24" aria-hidden="true"><path data-dc-tpl="17" d="M18 6L6 18M6 6l12 12"></path></svg></a>
    </div>

    <div data-dc-tpl="18" style="display: flex; flex-direction: column; gap: 8px;">
      <div data-dc-tpl="19" style="display: flex; justify-content: space-between;">
        <span data-dc-tpl="20" class="t-label" style="color: var(--ink-muted);">Charge ajoutée</span>
        <span data-dc-tpl="21" class="t-caption" style="color: var(--ink-muted);">Ceinture · pas de 1 kg</span>
      </div>
      <div data-dc-tpl="22" class="stepper">
        <button data-dc-tpl="23" class="step-btn" type="button" aria-label="Retirer 1 kg"><svg data-dc-tpl="24" class="icon" viewBox="0 0 24 24" aria-hidden="true"><path data-dc-tpl="25" d="M5 12h14"></path></svg></button>
        <div data-dc-tpl="26" class="step-val" aria-live="polite"><span class="sc-interp">+12 kg</span></div>
        <button data-dc-tpl="27" class="step-btn" type="button" aria-label="Ajouter 1 kg"><svg data-dc-tpl="28" class="icon" viewBox="0 0 24 24" aria-hidden="true"><path data-dc-tpl="29" d="M12 5v14M5 12h14"></path></svg></button>
      </div>
    </div>

    <div data-dc-tpl="30" style="display: flex; flex-direction: column; gap: 8px;">
      <div data-dc-tpl="31" style="display: flex; justify-content: space-between;">
        <span data-dc-tpl="32" class="t-label" style="color: var(--ink-muted);">Reps</span>
        <span data-dc-tpl="33" class="t-caption" style="color: var(--ink-muted);">Prévu : 5 · fourchette 3-5</span>
      </div>
      <div data-dc-tpl="34" class="stepper">
        <button data-dc-tpl="35" class="step-btn" type="button" aria-label="Une rep de moins"><svg data-dc-tpl="36" class="icon" viewBox="0 0 24 24" aria-hidden="true"><path data-dc-tpl="37" d="M5 12h14"></path></svg></button>
        <div data-dc-tpl="38" class="step-val" aria-live="polite"><span class="sc-interp">5</span></div>
        <button data-dc-tpl="39" class="step-btn" type="button" aria-label="Une rep de plus"><svg data-dc-tpl="40" class="icon" viewBox="0 0 24 24" aria-hidden="true"><path data-dc-tpl="41" d="M12 5v14M5 12h14"></path></svg></button>
      </div>
    </div>

    <div class="sc-host-x" data-dc-tpl="42" style="display: contents;"><div class="ca-rpe"><div class="ca-rpe-head"><span class="ca-label">RPE</span><span class="ca-rpe-max">Max pour monter : 9</span></div><div class="ca-rpe-steps" role="radiogroup" aria-label="RPE"><button type="button" role="radio" aria-checked="false" class="ca-rpe-step">≤6</button><button type="button" role="radio" aria-checked="false" class="ca-rpe-step">7</button><button type="button" role="radio" aria-checked="false" class="ca-rpe-step">8</button><button type="button" role="radio" aria-checked="true" class="ca-rpe-step ca-rpe-on">8,5</button><button type="button" role="radio" aria-checked="false" class="ca-rpe-step">9</button><button type="button" role="radio" aria-checked="false" class="ca-rpe-step ca-rpe-over">9,5</button><button type="button" role="radio" aria-checked="false" class="ca-rpe-step ca-rpe-over">10</button></div><p class="ca-rpe-meaning">Peut-être 2 reps de plus</p></div></div>

    <div data-dc-tpl="43" style="display: grid; grid-template-columns: minmax(0px, 1fr) minmax(0px, 1.6fr); gap: 8px;">
      <div class="sc-host-x" data-dc-tpl="44" style="display: contents;"><button type="button" class="ca-btn ca-btn-secondary ca-btn-lg ca-btn-block">Non effectuée</button></div>
      <a data-dc-tpl="45" class="ca-btn ca-btn-primary ca-btn-lg ca-btn-block" href="Seance.html">Enregistrer</a>
    </div>
  </section></div>
</body>
</html>
