<!-- @dsCard height=288 -->
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Coaching App</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .lime { fill:var(--lime); }
  .slab { fill:var(--contrast); }
  .hyp { fill:var(--hypertrophy); }
  .str { fill:var(--strength); }
  .end { fill:var(--endurance); }
  .stripe { fill:var(--on-lime); }
  .cut { fill:var(--lime); }
  .lg { rx:var(--radius-lg); }
  .sm { rx:var(--radius-sm); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-size:92px; line-height:.92; font-weight:800; letter-spacing:-.01em; color:var(--ink); }
  .tag { margin:var(--space-3) 0 0 2px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      lime 176×280 slab bled off the top (the brand fill, largest) · contrast 272×208 bleeding off the right edge · hypertrophy 96×24, strength 48×24, endurance 24×24 goal chips (radius-sm) above it — ≈40% of 960×288
  arrangement one tall lime slab with a heavy contrast slab beside it, bottoms on one line space-6 above the edge, space-4 gutter; goal chips stacked like plates on a bar
  pattern     stripes, from "bold and athletic: a scoreboard of big condensed numbers": six on-lime diagonal bars at a space-6 pitch across the lime slab's foot, two lime bars cut into the contrast slab
  scales      sides in space-2 multiples; gutter space-4; pitch space-6; corners radius-lg on slabs, radius-sm on chips
-->
<defs>
  <clipPath id="limeClip"><rect x="24" y="-16" width="176" height="280" rx="12"/></clipPath>
  <clipPath id="slabClip"><rect x="216" y="56" width="280" height="208" rx="12"/></clipPath>
</defs>
<rect class="lime lg" x="24" y="-16" width="176" height="280" rx="12"/>
<g clip-path="url(#limeClip)">
  <path class="stripe" d="M96 168 L108 168 L36 264 L24 264 Z"/>
  <path class="stripe" d="M120 168 L132 168 L60 264 L48 264 Z"/>
  <path class="stripe" d="M144 168 L156 168 L84 264 L72 264 Z"/>
  <path class="stripe" d="M168 168 L180 168 L108 264 L96 264 Z"/>
  <path class="stripe" d="M192 168 L204 168 L132 264 L120 264 Z"/>
  <path class="stripe" d="M216 168 L228 168 L156 264 L144 264 Z"/>
</g>
<rect class="slab lg" x="216" y="56" width="280" height="208" rx="12"/>
<g clip-path="url(#slabClip)">
  <path class="cut" d="M400 56 L416 56 L344 264 L328 264 Z"/>
  <path class="cut" d="M424 56 L440 56 L368 264 L352 264 Z"/>
</g>
<rect class="hyp sm" x="216" y="24" width="96" height="24" rx="8"/>
<rect class="str sm" x="320" y="24" width="48" height="24" rx="8"/>
<rect class="end sm" x="376" y="24" width="24" height="24" rx="8"/>
</svg>
</div>
<div class="words">
  <h1 class="name">Coaching<br>App</h1>
  <p class="tag">Tu notes tes séries. Le coach planifie la suivante.</p>
</div>
</div>
</body>
</html>
