<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>SessionStatus</title></head>
<body>
<div id="root"></div>
<script>
  var C = window.Coach, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h('div', {className:'ca-row'},
  ['planned','today','validated','missed','unplanned','not-completed'].map(function(s){ return h(C.SessionStatus, {key:s, status:s}); }))));
</script>
</body>
</html>
