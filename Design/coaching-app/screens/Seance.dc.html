<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Séance en cours</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="ds/coach/components/bundle.css">
<script src="ds/coach/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Condensed:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:var(--lime-ink)}a:hover{color:var(--ink)}
</style>
</helmet>
<div class="screen" data-theme="light" style="width: 390px; height: 1900px;">
  <header style="background: var(--contrast); color: var(--on-contrast); padding: 8px 16px 20px 8px; display: flex; flex-direction: column; gap: 12px; border-radius: 0 0 var(--radius-lg) var(--radius-lg);">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <a class="icon-btn" href="Main.dc.html" aria-label="Retour" style="color: var(--on-contrast);"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
      <span class="t-label" style="color: var(--on-contrast);">Samedi 17 octobre</span>
      <a class="icon-btn" href="Probleme.dc.html" aria-label="Signaler un problème" style="color: var(--on-contrast);"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><path d="M12 9v4M12 17h.01"></path></svg></a>
    </div>
    <div style="padding-left: 8px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between;">
        <h1 class="t-display-lg" style="margin: 0;">Séance C</h1>
        <span class="t-title-md">6/16</span>
      </div>
      <div role="progressbar" aria-label="Séries enregistrées" aria-valuenow="6" aria-valuemin="0" aria-valuemax="16" style="height: 8px; border-radius: var(--radius-xs); background: var(--contrast-track); overflow: hidden;">
        <div style="width: 38%; height: 100%; background: var(--contrast-fill); border-radius: var(--radius-xs);"></div>
      </div>
      <span class="t-caption" style="color: var(--on-contrast);">Exercice 2 sur 4 · 10 séries restantes</span>
    </div>
  </header>

  <main style="flex-grow: 1; display: flex; flex-direction: column; gap: 20px; padding: 20px 16px;">
    <x-import component-from-global-scope="Coach.ExerciseCard" name="Squat" goal="strength" position="1/4" status="validated" plan="{{squat}}" sets="{{ 4 }}" range="{{range35}}" equipment="4 séries sur 4 enregistrées"></x-import>

    <x-import component-from-global-scope="Coach.ExerciseCard" name="Tractions lestées" goal="strength" position="2/4" plan="{{pull}}" sets="{{ 5 }}" range="{{range35}}" equipment="Ceinture de lest" added-load="{{yes}}">
      <x-import component-from-global-scope="Coach.SetRow" index="{{ 1 }}" added-load="{{yes}}" planned="{{pullPlan}}" logged="{{p1}}" last="{{l1}}"></x-import>
      <x-import component-from-global-scope="Coach.SetRow" index="{{ 2 }}" added-load="{{yes}}" planned="{{pullPlan}}" logged="{{p2}}" last="{{l2}}"></x-import>
      <a href="SaisieSerie.dc.html" aria-label="Saisir la série 3" style="display: block; text-decoration: none; color: inherit; border-radius: var(--radius-md);">
        <x-import component-from-global-scope="Coach.SetRow" index="{{ 3 }}" active="{{yes}}" added-load="{{yes}}" planned="{{pullPlan}}" last="{{l3}}"></x-import>
      </a>
      <x-import component-from-global-scope="Coach.SetRow" index="{{ 4 }}" added-load="{{yes}}" planned="{{pullPlan}}" last="{{l4}}"></x-import>
      <x-import component-from-global-scope="Coach.SetRow" index="{{ 5 }}" added-load="{{yes}}" planned="{{pullPlan}}" last="{{l5}}"></x-import>
    </x-import>

    <x-import component-from-global-scope="Coach.ExerciseCard" name="Développé couché" goal="strength" position="3/4" status="planned" plan="{{bench}}" sets="{{ 4 }}" range="{{range35}}" equipment="Barre">
      <x-import component-from-global-scope="Coach.RecommendationNote" delta="{{ 6 }}" clamped="Gemini proposait 86 kg : limité à +10 %">Première série à 7 reps la semaine dernière, au-dessus de la fourchette : la charge était trop légère.</x-import>
    </x-import>

    <x-import component-from-global-scope="Coach.ExerciseCard" name="Rowing haltère" goal="hypertrophy" position="4/4" status="planned" plan="{{row}}" sets="{{ 3 }}" range="{{range610}}" equipment="Haltères"></x-import>
  </main>

  <div style="position: sticky; bottom: 0; display: flex; flex-direction: column; gap: 8px; padding: 16px; background: var(--surface-raised); box-shadow: var(--shadow-sheet); border-radius: var(--radius-lg) var(--radius-lg) 0 0;">
    <p class="t-caption" style="margin: 0; color: var(--ink-muted); text-align: center;">Enregistre ou marque « Non effectuée » chaque série pour valider.</p>
    <x-import component-from-global-scope="Coach.Button" variant="primary" size="lg" block="{{yes}}" disabled="{{yes}}">Valider la séance</x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      yes: true,
      range35: [3, 5],
      range610: [6, 10],
      squat: { weight: 104, reps: 3 },
      pull: { weight: 12, reps: 5 },
      bench: { weight: 82, reps: 3 },
      row: { weight: 30, reps: 8 },
      pullPlan: { weight: 12, reps: 5 },
      p1: { weight: 12, reps: 5, rpe: 8 },
      p2: { weight: 12, reps: 5, rpe: 8.5 },
      l1: { weight: 12, reps: 5, rpe: 8 },
      l2: { weight: 12, reps: 5, rpe: 8.5 },
      l3: { weight: 12, reps: 5, rpe: 9 },
      l4: { weight: 12, reps: 5, rpe: 9 },
      l5: { weight: 12, reps: 4, rpe: 9.5 }
    };
  }
}
</script>
</body>
</html>
