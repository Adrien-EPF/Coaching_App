<div id="root"></div>
<script>
  var C = window.Coach, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h('div', {className:'ca-stack'},
  h(C.SetRow, {index:1, planned:{weight:100, reps:5}, logged:{weight:100, reps:5, rpe:8}, last:{weight:97.5, reps:5, rpe:8}}),
  h(C.SetRow, {index:2, active:true, planned:{weight:100, reps:5}, last:{weight:97.5, reps:5, rpe:8.5}}),
  h(C.SetRow, {index:3, status:'not-completed', planned:{weight:100, reps:5}}),
  h(C.SetRow, {index:1, addedLoad:true, planned:{weight:10, reps:5}, logged:{weight:10, reps:4, rpe:9.5}, last:{weight:7.5, reps:5, rpe:9}}))));
</script>
</body>
