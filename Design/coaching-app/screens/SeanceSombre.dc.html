<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Séance en cours, thème sombre</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="ds/coach/components/bundle.css">
<script src="ds/coach/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Condensed:wght@600;700;800&amp;display=swap">
<style>
body{margin:0;background:var(--surface)}
a{color:var(--lime-ink)}a:hover{color:var(--ink)}
</style>
</helmet>
<div class="screen" data-theme="dark" style="width: 390px; height: 844px;">
  <header style="background: var(--contrast); color: var(--on-contrast); padding: 8px 16px 16px 8px; display: flex; flex-direction: column; gap: 10px; border-radius: 0 0 var(--radius-lg) var(--radius-lg);">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <a class="icon-btn" href="Main.dc.html" aria-label="Retour" style="color: var(--on-contrast);"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
      <span class="t-label" style="color: var(--on-contrast);">Samedi 17 octobre</span>
      <span style="width: 48px;"></span>
    </div>
    <div style="padding-left: 8px; display: flex; align-items: baseline; justify-content: space-between;">
      <h1 class="t-display-lg" style="margin: 0;">Séance C</h1>
      <span class="t-title-md">6/16</span>
    </div>
    <div role="progressbar" aria-label="Séries enregistrées" aria-valuenow="6" aria-valuemin="0" aria-valuemax="16" style="margin-left: 8px; height: 8px; border-radius: var(--radius-xs); background: var(--contrast-track); overflow: hidden;">
      <div style="width: 38%; height: 100%; background: var(--contrast-fill); border-radius: var(--radius-xs);"></div>
    </div>
  </header>

  <main style="flex-grow: 1; padding: 20px 16px; display: flex; flex-direction: column; gap: 20px;">
    <x-import component-from-global-scope="Coach.ExerciseCard" name="Tractions lestées" goal="strength" position="2/4" plan="{{pull}}" sets="{{ 5 }}" range="{{range}}" equipment="Ceinture de lest" added-load="{{yes}}">
      <x-import component-from-global-scope="Coach.SetRow" index="{{ 2 }}" added-load="{{yes}}" planned="{{pull}}" logged="{{p2}}" last="{{l2}}"></x-import>
      <x-import component-from-global-scope="Coach.SetRow" index="{{ 3 }}" active="{{yes}}" added-load="{{yes}}" planned="{{pull}}" last="{{l3}}"></x-import>
      <x-import component-from-global-scope="Coach.SetRow" index="{{ 4 }}" added-load="{{yes}}" planned="{{pull}}" last="{{l4}}"></x-import>
    </x-import>
  </main>

  <div style="padding: 16px; background: var(--surface-raised); box-shadow: var(--shadow-sheet); border-radius: var(--radius-lg) var(--radius-lg) 0 0;">
    <a class="ca-btn ca-btn-primary ca-btn-lg ca-btn-block" href="SaisieSerie.dc.html">Saisir la série 3</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      yes: true,
      range: [3, 5],
      pull: { weight: 12, reps: 5 },
      p2: { weight: 12, reps: 5, rpe: 8.5 },
      l2: { weight: 12, reps: 5, rpe: 8.5 },
      l3: { weight: 12, reps: 5, rpe: 9 },
      l4: { weight: 12, reps: 5, rpe: 9 }
    };
  }
}
</script>
</body>
</html>
