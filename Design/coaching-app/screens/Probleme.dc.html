<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Signaler un problème</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="ds/coach/components/bundle.css">
<script src="ds/coach/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Condensed:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:var(--lime-ink)}a:hover{color:var(--ink)}
</style>
</helmet>
<div class="screen" data-theme="light" style="width: 390px; height: 844px; position: relative;">
  <div aria-hidden="true" style="padding: 24px 16px; display: flex; flex-direction: column; gap: 16px;">
    <span class="t-display-lg">Octobre</span>
    <div class="card" style="height: 300px;"></div>
  </div>
  <div class="scrim" style="position: absolute; inset: 0;"></div>

  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="pb-title" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 20px;">
    <div class="grabber"></div>
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <span class="t-label" style="color: var(--ink-muted);">Séance A · lundi 19 octobre</span>
      <h2 id="pb-title" class="t-title-lg" style="margin: 0;">Signaler un problème</h2>
      <p class="t-body" style="margin: 0; color: var(--ink-muted);">Le plan de cette séance sera recalculé avec ta note.</p>
    </div>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px;">
      <legend class="t-label" style="color: var(--ink-muted); padding: 0 0 8px;">Ce qui ne va pas</legend>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
          <button type="button" class="{{c.cls}}" aria-pressed="{{c.pressed}}" onClick="{{c.toggle}}">{{c.label}}</button>
        </sc-for>
      </div>
    </fieldset>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <label for="pb-note" class="t-label" style="color: var(--ink-muted);">Précisions</label>
      <textarea id="pb-note" class="field" rows="3" style="resize: none;">5 h de sommeil. Épaule droite un peu raide.</textarea>
    </div>

    <div style="display: flex; gap: 8px; align-items: flex-start; padding: 12px; border-radius: var(--radius-md); background: var(--surface-sunken);">
      <svg class="icon icon-20" viewBox="0 0 24 24" aria-hidden="true" style="margin-top: 1px;"><path d="M12 2l8 3v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V5z"></path></svg>
      <p class="t-caption" style="margin: 0; color: var(--ink);">Avec un problème signalé, Gemini peut garder ou baisser les charges, jamais les monter.</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <a class="ca-btn ca-btn-primary ca-btn-lg ca-btn-block" href="Calendrier.dc.html">Replanifier la séance</a>
      <a class="ca-btn ca-btn-ghost ca-btn-block" href="Calendrier.dc.html">Annuler</a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { on: { 'Mauvais sommeil': true, 'Douleur': true } }; }
  renderVals() {
    var on = this.state.on;
    var labels = ['Mauvais sommeil', 'Douleur', 'Fatigue', 'Malade', 'Stress', 'Autre'];
    return {
      chips: labels.map((l) => ({
        label: l,
        cls: on[l] ? 'chip chip-on' : 'chip',
        pressed: on[l] ? 'true' : 'false',
        toggle: () => { var n = Object.assign({}, on); n[l] = !on[l]; this.setState({ on: n }); }
      }))
    };
  }
}
</script>
</body>
</html>
