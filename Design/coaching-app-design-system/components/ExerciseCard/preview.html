<!-- @dsCard group="Session" height=560 -->
<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>ExerciseCard</title></head>
<body>
<div id="root"></div>
<script>
  var C = window.Coach, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h('div', {className:'ca-stack', style:{maxWidth:440}},
  h(C.ExerciseCard, {name:'Développé couché', goal:'strength', position:'1/5', plan:{weight:102.5, reps:5}, sets:4, range:[3,5], equipment:'Barre',
    note: h(C.RecommendationNote, {delta:2.5}, 'Toutes les séries ont atteint 5 reps à RPE 8 ou moins : on monte de 2,5 kg.')},
    h(C.SetRow, {index:1, planned:{weight:102.5, reps:5}, logged:{weight:102.5, reps:5, rpe:8}, last:{weight:100, reps:5, rpe:8}}),
    h(C.SetRow, {index:2, active:true, planned:{weight:102.5, reps:5}, last:{weight:100, reps:5, rpe:8}})))));
</script>
</body>
</html>
